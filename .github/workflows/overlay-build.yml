name: "Overlay build (Windows x64, unsigned)"

on: workflow_dispatch

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      sign-binaries: false
      asset-prefix: "handy-overlay"
      upload-artifacts: true
    secrets: inherit
